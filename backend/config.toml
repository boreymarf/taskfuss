[app]
environment = "dev"

[app.dev]
reload_app = true
reload_dirs = [
    "src",
]

[server]
port = 5000
allow_origins = [
    "http://localhost:6006",
    "http://localhost:5173",
]
allow_credentials = true
allow_methods = [
    "GET",
    "POST",
    "PUT",
    "DELETE",
    "OPTIONS",
]
allow_headers = [
    "Authorization",
    "Content-Type",
]

[security]
auth_secret_key = "change-me"
auth_token_lifespan_minutes = 120

[security.login_policy]
min_length = 3
max_length = 20
allow_lowercase = true
allow_uppercase = true
allow_digits = true
allow_underscore = true
allow_hyphen = false
allow_dots = false
allow_cyrillic = false
allow_special = false

[security.password_policy]
min_length = 6
max_length = 128
require_uppercase = false
require_digit = false
require_special = false

[logging]
log_level = "DEBUG"
shushed_modules = [
    "asyncio",
    "passlib",
]

[database]
db_type = "sqlite"
db_path = "data/data.db"
